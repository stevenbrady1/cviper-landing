<!--
  A signpost, not a page. The real policy is at /privacy/.

  WHY THIS FILE EXISTS
  The CViper Light app repository already publishes this exact URL as its
  store-listing privacy URL, in two committed places:

      stevenbrady1/cviper-light
        docs/app-store/LISTING.md      "Privacy Policy URL | https://cviper.ai/light/privacy"
        docs/app-store/README.md       "The hosted site publishes it at cviper.ai/light/privacy"

  A store submission whose privacy URL 404s is rejected, so this address has to
  resolve. It forwards to /privacy/ rather than duplicating the text, because a
  second copy of a privacy policy is a second thing to drift.

  If the app repo's listing is ever changed to point at /privacy/ directly,
  this file can be deleted.

  No external requests, consistent with the rest of this site: a meta refresh
  plus a real link, so it works with JavaScript disabled.
-->
