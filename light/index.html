<!--
  A signpost, not a page. The page about CViper Light is the home page.

  WHY THIS FILE EXISTS
  The app already publishes this exact URL, in code and in its store listing:

      stevenbrady1/cviper-light
        apps/light/src/features/signposts/links.ts
          LIGHT_PAGE_URL = 'https://cviper.ai/light'
        apps/light/src/features/settings/about/About.tsx
          the About entry, whose visible text reads "cviper.ai/light →"
        docs/app-store/LISTING.md        "Marketing URL | https://cviper.ai/light"
        docs/STORE-SUBMISSION.md         "Website | https://cviper.ai/light"

  Until this file existed that link 404'd for every user who tapped About, and
  a store listing whose marketing URL 404s is a bad first impression at best.

  WHY A FORWARDER AND NOT A REAL PAGE
  cviper.ai IS the page about CViper Light - the whole home page is about this
  one app. A second page describing the same product would be a second thing to
  keep true, and drift between two descriptions of one product is precisely the
  defect this file was written alongside: /privacy/ had been wrong for four app
  releases because nothing held it to the app. One description, one place to
  fix.

  It also means the app needs no change and no re-tag: the shipped constant and
  the visible "cviper.ai/light →" text stay correct, as does every document
  that cites the URL.

  If the home page ever stops being about CViper Light, this file becomes a
  real page rather than a forwarder. Do not delete it - the URL is published in
  shipped code and in a store listing.

  No external requests, consistent with the rest of this site: a meta refresh
  plus a real link, so it works with JavaScript disabled.
-->
